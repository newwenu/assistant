name: CI

# 目的：把「开发机只有 Windows」的验证缺口交给 GitHub Actions 的真实虚拟机。
#
# 平台结论差异（见 I53 沙箱准备任务清单（已归档） 验收记录）：
# - Linux：Landlock 用例会真实执行（A-S1 / A-S2 / A-S3），失败即边界失效；
# - macOS：Seatbelt 仍是占位，只能验证「编译通过 + probe 不可用 → 不注册 shell」的 fail-closed；
# - Windows：本机可完整执行（fmt / 编译 / 用例），因此 CI 不再重复跑 Windows，只保留开发机跑不到的 Linux 与 macOS。
#
# 可选特性关闭态（full / slim / 单特性两态）的落点：
# - 前端在 ubuntu 上跑 full build + `VAULT_ENABLED=0 CLOCK_ENABLED=0` slim build + 产物字符串探针；
#   slim build 同时由 Vite 产物图断言（F7）硬失败兜底（断言根同时覆盖 src/features/ 与 src/tools/）；
# - 后端关闭态只在 Linux 跑（`-p assistant-app --no-default-features`），并追加
#   `assert-feature-shed.mjs` 的 normal-edge 依赖图断言（CI-2），不跑 workspace 全量——
#   workspace 成员的测试目标仍会编译 assistant-vault / assistant-clock 自身，不能作为关闭态证据；
# - 单特性独立性由 `--features vault` / `--features clock` 两组互补证据覆盖：
#   前者证明关 clock 时 assistant-clock 不在 normal-edge 图，后者证明关 vault 时三个 vault crate 消失；
# - Windows 仍不进 CI（同上平台结论），关闭态由开发机 `feature-build.ps1 -Preset <name>` 覆盖。
#
# 本文件是草稿：首次接入时若某平台因 runner 环境（缺失系统库、内核 Landlock 不可用）失败，
# 先修环境或把该步拆成独立 job，不要用 continue-on-error 掩盖失败。

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # 与开发机一致；升级工具链时同步本行与 Cargo.lock。
  RUST_TOOLCHAIN: "1.100.0"
  NODE_VERSION: "26"

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 格式检查
        run: npm run format:check

      # CI 里不跑 `npm run lint`（它会先 prettier --write），避免把改写后的文件带入后续比对。
      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: 单元测试
        run: npm test

      # full 态：确认默认（含 vault）构建不误报，F7 落地后这里同时守产物图断言。
      - name: 前端构建（full）
        run: npm run build

      # slim 态：两个特性都关，特性模块不得进入产物图（F7 由此步硬失败）。
      - name: 前端构建（slim / VAULT_ENABLED=0 CLOCK_ENABLED=0）
        run: VAULT_ENABLED=0 CLOCK_ENABLED=0 npm run build

      # 字符串探针作为 slim 态的补充证据：产物中不得出现 settings.vault.* / tools.clock.* 文案。
      - name: 关闭态产物字符串探针（vault）
        run: node scripts/assert-feature-absent.mjs --feature vault --dist dist

      - name: 关闭态产物字符串探针（clock）
        run: node scripts/assert-feature-absent.mjs --feature clock --prefix tools --dist dist

  rust:
    name: Rust 实机测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 主 app 依赖 Tauri（Linux 需要 WebKitGTK 系列），vault 的 Linux 后端链接 libsecret。
      - name: 安装 Linux 原生依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 格式检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # 沙箱用例单独一步：失败时直接从步骤名定位到 I53 验收项（A-S1 / A-S2 / A-S3 / A-S5 / A-S7）。
      - name: 沙箱实机用例（I53）
        working-directory: src-tauri
        run: cargo test -p assistant-tools --all-targets --no-fail-fast

      # --no-fail-fast：一个 target 失败不吞掉其余 target 的结果，便于一次看清三平台差异。
      - name: 工作区测试
        working-directory: src-tauri
        run: cargo test --workspace --all-targets --no-fail-fast

      # 关闭态只在 Linux 跑一次：--no-default-features 必须落在 assistant-app 这个 package 上，
      # workspace 全量的测试目标仍会编译 assistant-vault 自身，不能当关闭态证据。
      - name: 关闭态编译（slim）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo check -p assistant-app --no-default-features

      - name: 关闭态装配契约（slim）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test -p assistant-app --no-default-features --test assembly_contract

      # 契约生成需要 Node + 上面装的 Tauri 依赖，只在 Linux 跑一次，避免三平台重复编译。
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 契约生成物同步校验（Linux）
        if: runner.os == 'Linux'
        run: |
          npm ci
          npm run contract:check

      # CI-2：关闭态依赖图断言。禁用特性的 `dep:` crate 不得出现在 normal-edge 图，
      # 否则「关闭」只是不注册，依赖仍被编进二进制。脚本内部 cwd = src-tauri。
      - name: 关闭态依赖断开断言（slim）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: node ../scripts/assert-feature-shed.mjs

      # 单特性独立性：--features vault 时 clock 必须整块消失（assistant-clock 不在 normal-edge 图）。
      - name: 单特性编译（--features vault）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo check -p assistant-app --no-default-features --features vault

      - name: 单特性装配契约（--features vault）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test -p assistant-app --no-default-features --features vault --test assembly_contract

      - name: 单特性依赖断开断言（--features vault）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: node ../scripts/assert-feature-shed.mjs --features vault

      # 单特性独立性：--features clock 时 vault 必须整块消失（三个 vault crate 不在 normal-edge 图）。
      - name: 单特性编译（--features clock）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo check -p assistant-app --no-default-features --features clock

      - name: 单特性装配契约（--features clock）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test -p assistant-app --no-default-features --features clock --test assembly_contract

      - name: 单特性依赖断开断言（--features clock）
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: node ../scripts/assert-feature-shed.mjs --features clock
