[workspace]
resolver = "2"
members = [
    "crates/assistant-app",
    "crates/assistant-config",
    "crates/assistant-orb",
    "crates/assistant-providers",
    "crates/assistant-agent",
    "crates/assistant-storage",
    "crates/assistant-i18n",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
mouse_position = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "6"

assistant-config = { path = "crates/assistant-config" }
assistant-orb = { path = "crates/assistant-orb" }
assistant-providers = { path = "crates/assistant-providers" }
assistant-agent = { path = "crates/assistant-agent" }
assistant-storage = { path = "crates/assistant-storage" }
assistant-i18n = { path = "crates/assistant-i18n" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true