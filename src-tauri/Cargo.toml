[package]
name = "assistant-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
resolver = "2"
members = [
    "crates/assistant-config",
    "crates/assistant-orb",
    "crates/assistant-providers",
    "crates/assistant-agent",
    "crates/assistant-storage",
    "crates/assistant-i18n",
    "crates/assistant-tools",
    "crates/assistant-security",
    "crates/assistant-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
# tauri-plugin-sql 已移除：前端未使用 JS 绑定，Rust 端统一用 rusqlite，避免双份 SQLite 编译
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
rustc_version_runtime = "0.3"
mouse_position = "0.1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
dirs = "7"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
data-encoding = "2"
machine-uid = "0.2"
hex = "0.4"
argon2 = "0.5"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive", "alloc"] }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
# tokio-stream 已移除：仅用 Stream trait re-export，已替换为 futures::Stream（同一 trait）
# async-trait 保留：Rust 原生 async fn in trait 不兼容 dyn Trait（无法构建 vtable），见 assistant-tools/src/trait.rs
async-trait = "0.1"
dashmap = "6"
chardetng = "0.1"
encoding_rs = "0.8"
async-stream = "0.3"
rand = "0.8"
bytes = "1"
urlencoding = "2"
proptest = "1"
rust-i18n = "4"
crash-handler = "0.6"
minidump-writer = "0.10"

assistant-config = { path = "crates/assistant-config" }
assistant-orb = { path = "crates/assistant-orb" }
assistant-providers = { path = "crates/assistant-providers" }
assistant-agent = { path = "crates/assistant-agent" }
assistant-storage = { path = "crates/assistant-storage" }
assistant-i18n = { path = "crates/assistant-i18n" }
assistant-tools = { path = "crates/assistant-tools" }
assistant-security = { path = "crates/assistant-security" }
assistant-sync = { path = "crates/assistant-sync" }
arboard = "3"
csv = "1"
hmac = "0.12"
sha1 = "0.10"
zxcvbn = "3"
keyring = { version = "4", features = ["v1"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Security_Cryptography_DataProtection",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Power",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
] }
eventsource-stream = "0.2"
tempfile = "3"
windows-future = "0.3"
core-foundation = "0.10"
security-framework = "3.0"
libsecret = "0.1"
ssh-key = { version = "0.6", features = ["encryption", "rsa", "ed25519"] }
rsa = { version = "0.9", features = ["pem"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-dialog = { workspace = true }
mouse_position = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
arboard = { workspace = true }
csv = { workspace = true }

assistant-config = { workspace = true }
assistant-orb = { workspace = true }
assistant-providers = { workspace = true }
assistant-agent = { workspace = true }
assistant-storage = { workspace = true }
assistant-i18n = { workspace = true }
assistant-tools = { workspace = true }
assistant-security = { workspace = true }
assistant-sync = { workspace = true }
rustc_version_runtime.workspace = true
crash-handler = { workspace = true }
minidump-writer = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
minidump = "0.27.0"
pdb = "0.8"
rustc-demangle = "0.1"
