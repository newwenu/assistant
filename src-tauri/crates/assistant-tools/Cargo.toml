[package]
name = "assistant-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# 跨 crate 共享测试夹具：把 `tests/support/link.rs` 以公开模块形式暴露给其它
# package 的集成测试。集成测试看不到 lib 的 `#[cfg(test)]` 项，因此用 feature 门控。
# 仅测试构建启用，不随默认特性进入产物。
test-support = []

[dependencies]
assistant-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
# async-trait 保留：Rust 原生 async fn in trait 不兼容 dyn Trait（无法构建 vtable），见 trait.rs
async-trait = { workspace = true }
dashmap = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true }
# P5 OS 工具：遍历 / glob 匹配 / 正则搜索 / 原子写
ignore = { workspace = true }
globset = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
tempfile = { workspace = true }
trash = { workspace = true }
# P7 MCP：工具名短哈希与参数指纹（规格 I38e §3.1 / §3.5）
sha2 = { workspace = true }
hex = { workspace = true }
# P7 MCP：取消令牌（规格 I38e §4.3）
tokio-util = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# P14-a 沙箱：Landlock 后端（仅 Linux 目标编译，见 I53 §5.5）
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

# Unix 后端共用的 `setsid(2)` / `kill(-pgid)`（Linux Landlock、macOS Seatbelt）
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
